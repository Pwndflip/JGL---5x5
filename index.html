<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dexter Hub - Clean Stream</title>
    <style>
        :root { --primary-color: #e50914; --bg-color: #050505; --card-bg: #121212; --text-color: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        
        header { padding: 15px; background: #000; border-bottom: 2px solid var(--primary-color); text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; max-width: 1200px; margin: 0 auto; }

        /* Player Sektion */
        #player-section { display: none; margin-bottom: 25px; }
        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
        }
        
        /* Der unsichtbare Werbe-Blocker über dem iFrame */
        .video-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1;
        }

        .btn-back { background: #222; color: white; border: 1px solid #444; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }

        /* Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 15px; }
        .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .movie-card:hover { border-color: var(--primary-color); transform: translateY(-5px); }
        .card-img { aspect-ratio: 2/3; background: linear-gradient(135deg, #1a1a1a, #000); display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-weight: bold; text-align: center; padding: 10px; font-size: 0.8rem; }
        .card-title { padding: 10px; font-size: 0.85rem; text-align: center; margin: 0; font-weight: bold; }

        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
    </style>
</head>
<body>

    <header>DEXTER<span style="color:var(--primary-color)">HUB</span></header>

    <div class="container">
        <section id="player-section">
            <button class="btn-back" onclick="closePlayer()">← Übersicht</button>
            <h3 id="display-title" style="margin: 0 0 10px 0; font-size: 1rem; color: #ccc;"></h3>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <h2 style="font-size: 1.1rem; border-left: 3px solid var(--primary-color); padding-left: 10px;">SAMMLUNG</h2>
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <script>
        const contentData = [
            { id: "1405", title: "Dexter" },
            { id: "259909", title: "Dexter: Resurrection" },
            { id: "131927", title: "Dexter: New Blood" },
            { id: "219937", title: "Dexter: Original Sin" },
            { id: "49530", title: "Dexter: Early Cuts" }
        ];

        const mainGrid = document.getElementById('main-grid');
        const playerSec = document.getElementById('player-section');
        const homeSec = document.getElementById('home-section');
        const videoRoot = document.getElementById('video-root');
        const displayTitle = document.getElementById('display-title');

        function init() {
            mainGrid.innerHTML = contentData.map(item => `
                <div class="movie-card" onclick="playContent('${item.id}', '${item.title}')">
                    <div class="card-img">${item.title}</div>
                    <p class="card-title">${item.title}</p>
                </div>
            `).join('');
        }

        function playContent(id, title) {
            displayTitle.textContent = title;
            const url = `https://www.vidking.net/embed/tv/${id}/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
            
            // Wir ENTFERNEN allow-popups, um Werbung zu killen. 
            // Wir behalten allow-popups-to-escape-sandbox, um Menüs eine Chance zu geben.
            videoRoot.innerHTML = `
                <iframe 
                    src="${url}" 
                    allowfullscreen 
                    sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-popups-to-escape-sandbox"
                    allow="autoplay; fullscreen">
                </iframe>`;

            homeSec.style.display = 'none';
            playerSec.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closePlayer() {
            videoRoot.innerHTML = '';
            playerSec.style.display = 'none';
            homeSec.style.display = 'block';
        }

        init();
    </script>
</body>
</html>
