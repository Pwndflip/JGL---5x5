<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.vidking.net https://www.youtube.com; frame-src https://www.vidking.net https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src * data:;">
    <title>Dexter Universe</title>
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #050505;
            --card-bg: #121212;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.95);
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

        .language-switcher { display: flex; gap: 8px; }

        .lang-btn {
            background: #222; color: #fff; border: 1px solid #444; padding: 8px 14px;
            border-radius: 6px; font-size: 0.9rem; cursor: pointer;
        }
        .lang-btn.active { background: var(--primary-color); border-color: var(--primary-color); font-weight: bold; }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }

        #player-section { display: none; margin-bottom: 30px; }
        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0;
            background: #000; border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .video-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .loading-overlay, .error-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5,5,5,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--primary-color);
            z-index: 10; text-align: center; padding: 20px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #222;
            border-top: 5px solid var(--primary-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-back {
            background: #222; color: white; border: 1px solid #444;
            padding: 12px; border-radius: 8px; font-size: 1rem;
            font-weight: bold; cursor: pointer; width: 100%;
        }

        h2 { font-size: 1.4rem; margin-bottom: 25px; padding-left: 5px; border-left: 4px solid var(--primary-color); }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            transition: all 0.25s ease;
            border: 1px solid #222; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .movie-card:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(229,9,20,0.4); }

        .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }

        .card-content { padding: 12px; }
        .card-title { margin: 0 0 4px 0; font-size: 0.95rem; font-weight: 600; }
        .card-year { margin: 0; color: #888; font-size: 0.8rem; }

        .continue-badge {
            position: absolute; top: 10px; right: 10px;
            background: var(--primary-color); color: white;
            font-size: 0.75rem; padding: 4px 10px; border-radius: 4px;
            font-weight: bold; z-index: 5;
        }

        footer {
            text-align: center; padding: 40px 20px 30px; color: #666; font-size: 0.85rem;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DEXTER<span style="color:var(--primary-color)">HUB</span></div>
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="en" onclick="changeLanguage('en')">EN</button>
            <button class="lang-btn" data-lang="tr" onclick="changeLanguage('tr')">TR</button>
        </div>
    </header>

    <div class="container">
        <section id="player-section">
            <div class="controls">
                <button class="btn-back" id="btn-back">← Back</button>
                <h3 id="display-title" style="margin: 10px 0 0 0; font-size: 1.15rem;">Title</h3>
            </div>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <h2 id="section-title">Chronological Order</h2>
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <footer>Made with ❤️ by <strong>Weird</strong></footer>

    <script>
        const translations = {
            en: { back: "← Back", sectionTitle: "Chronological Order", loading: "Loading...", slowHint: "Vidking can be slow", error: "Content could not be loaded.<br>Please try again or use another browser.", continueWatching: "Continue" },
            tr: { back: "← Geri", sectionTitle: "Kronolojik Sıra", loading: "Yükleniyor...", slowHint: "Vidking yavaş olabilir", error: "İçerik yüklenemedi.<br>Lütfen tekrar deneyin veya başka tarayıcı kullanın.", continueWatching: "Devam et" }
        };

        let currentLang = 'en';
        let lastWatchedId = localStorage.getItem('dexterLastWatched') || null;

        const contentData = [
            { id: "original-sin", titleEn: "Dexter: Original Sin", titleTr: "Dexter: Orijinal Günah", year: "2024", vidkingId: "219937", poster: "https://image.tmdb.org/t/p/w500/9wldu.jpg", useSelector: true },
            { id: "early-cuts",    titleEn: "Dexter: Early Cuts", titleTr: "Dexter: Erken Kesimler", year: "2009", poster: "https://image.tmdb.org/t/p/w500/f0bFe.jpg", type: "youtube", youtubeId: "iI79oLKBGs4" },
            { id: "dexter",        titleEn: "Dexter (Seasons 1-8)", titleTr: "Dexter (Sezon 1-8)", year: "2006", vidkingId: "1405", poster: "https://image.tmdb.org/t/p/w500/8oTe9nI1o8vJ9yY5Z4Z3z5y5Z3z.jpg", useSelector: true },
            { id: "new-blood",     titleEn: "Dexter: New Blood", titleTr: "Dexter: Yeni Kan", year: "2021", vidkingId: "131927", poster: "https://image.tmdb.org/t/p/w500/bvrvb.jpg", useSelector: true },
            { id: "resurrection",  titleEn: "Dexter: Resurrection", titleTr: "Dexter: Resurrection", year: "2025", vidkingId: "259909", poster: "https://image.tmdb.org/t/p/w500/BuIaS.jpg", useSelector: true }
        ];

        // DOM Elements
        const grid = document.getElementById('main-grid');
        const playerSec = document.getElementById('player-section');
        const homeSec = document.getElementById('home-section');
        const videoRoot = document.getElementById('video-root');
        const displayTitle = document.getElementById('display-title');
        const btnBack = document.getElementById('btn-back');
        const sectionTitle = document.getElementById('section-title');

        function updateLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
            btnBack.textContent = translations[lang].back;
            sectionTitle.textContent = translations[lang].sectionTitle;
            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';

            contentData.forEach((item, index) => {
                const title = currentLang === 'tr' ? item.titleTr : item.titleEn;

                const card = document.createElement('div');
                card.className = 'movie-card';

                let html = `
                    <img src="${item.poster}" class="card-img" loading="lazy" alt="${title}">
                    <div class="card-content">
                        <p class="card-title">${title}</p>
                        <p class="card-year">${item.year}</p>
                    </div>
                `;

                if (lastWatchedId === item.id) {
                    html = `<div class="continue-badge">${translations[currentLang].continueWatching}</div>` + html;
                }

                card.innerHTML = html;
                card.onclick = () => playContent(index);
                grid.appendChild(card);
            });
        }

        function showLoading() {
            videoRoot.innerHTML = `<div class="loading-overlay"><div class="spinner"></div><div>${translations[currentLang].loading}</div><small>${translations[currentLang].slowHint}</small></div>`;
        }

        function showError() {
            videoRoot.innerHTML = `<div class="error-overlay"><div style="font-size:2.5rem;margin-bottom:15px;">⚠️</div><div>${translations[currentLang].error}</div></div>`;
        }

        function playContent(index) {
            const item = contentData[index];
            const title = currentLang === 'tr' ? item.titleTr : item.titleEn;
            displayTitle.textContent = title;

            lastWatchedId = item.id;
            localStorage.setItem('dexterLastWatched', lastWatchedId);

            showLoading();

            let url = item.type === "youtube" 
                ? `https://www.youtube.com/embed/${item.youtubeId}?autoplay=1&modestbranding=1` 
                : `https://www.vidking.net/embed/tv/${item.vidkingId}/1/1?color=e50914&autoPlay=true${item.useSelector ? '&nextEpisode=true&episodeSelector=true' : ''}`;

            setTimeout(() => {
                videoRoot.innerHTML = `<iframe src="${url}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe>`;
            }, 400);

            homeSec.style.display = 'none';
            playerSec.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            videoRoot.innerHTML = '';
            playerSec.style.display = 'none';
            homeSec.style.display = 'block';
            renderGrid();
        }

        // Init
        btnBack.addEventListener('click', closePlayer);
        updateLanguage('en');
        renderGrid();
    </script>
</body>
</html>
