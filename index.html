<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dexter Hub</title>
    <style>
        :root { --primary-color: #e50914; --bg-color: #050505; --card-bg: #121212; --text-color: #ffffff; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; padding: 0; 
        }

        header { 
            padding: 20px; 
            text-align: center; 
            font-weight: 900; 
            letter-spacing: 3px; 
            background: linear-gradient(to bottom, #000, transparent);
        }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }

        /* Player Sektion */
        #player-section { display: none; animation: fadeIn 0.3s ease; }
        .video-container { 
            position: relative; padding-bottom: 56.25%; height: 0; 
            background: #000; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .btn-back { 
            background: #222; color: white; border: none; 
            padding: 10px 20px; border-radius: 8px; cursor: pointer; 
            margin-bottom: 15px; font-weight: bold;
        }

        /* Grid Sektion */
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
        }
        .movie-card { 
            background: var(--card-bg); border-radius: 10px; 
            overflow: hidden; cursor: pointer; transition: 0.3s; 
            border: 1px solid #222;
        }
        .movie-card:hover { transform: scale(1.05); border-color: var(--primary-color); }
        
        .card-img { 
            aspect-ratio: 2/3; background: #1a1a1a; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--primary-color); font-weight: bold; text-align: center; padding: 10px;
        }
        .card-title { padding: 12px; font-size: 0.9rem; text-align: center; margin: 0; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header>DEXTER<span style="color:var(--primary-color)">HUB</span></header>

    <div class="container">
        <section id="player-section">
            <button class="btn-back" onclick="closePlayer()">← Zurück</button>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <script>
        const contentData = [
            { id: "1405", title: "Dexter" },
            { id: "259909", title: "Dexter: Resurrection" },
            { id: "131927", title: "Dexter: New Blood" },
            { id: "219937", title: "Dexter: Original Sin" },
            { id: "49530", title: "Dexter: Early Cuts" }
        ];

        let activeId = null;
        const mainGrid = document.getElementById('main-grid');
        const playerSec = document.getElementById('player-section');
        const homeSec = document.getElementById('home-section');
        const videoRoot = document.getElementById('video-root');

        // Watch Progress Tracking (unsichtbar im Hintergrund)
        window.addEventListener("message", function (event) {
            if (event.origin.includes("vidking.net") && activeId) {
                try {
                    let data = (typeof event.data === "string" && event.data.startsWith("{")) ? JSON.parse(event.data) : event.data;
                    
                    // Speichere Rohdaten oder Prozent im Hintergrund
                    localStorage.setItem(`dexter_status_${activeId}`, JSON.stringify({
                        progress: data.percentage || data.progress || 0,
                        lastSeen: new Date().toISOString()
                    }));
                } catch (e) {}
            }
        });

        function init() {
            mainGrid.innerHTML = contentData.map(item => `
                <div class="movie-card" onclick="playContent('${item.id}', '${item.title}')">
                    <div class="card-img">${item.title}</div>
                    <p class="card-title">${item.title}</p>
                </div>
            `).join('');
        }

        function playContent(id, title) {
            activeId = id;
            const url = `https://www.vidking.net/embed/tv/${id}/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
            
            videoRoot.innerHTML = `
                <iframe src="${url}" allowfullscreen 
                sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-popups-to-escape-sandbox" 
                allow="autoplay; fullscreen"></iframe>`;

            homeSec.style.display = 'none';
            playerSec.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closePlayer() {
            videoRoot.innerHTML = '';
            playerSec.style.display = 'none';
            homeSec.style.display = 'block';
            activeId = null;
        }

        init();
    </script>
</body>
</html>
