<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dexter Hub - Final Poster Edition</title>
    <style>
        :root { 
            --primary-color: #e50914; 
            --bg-color: #050505; 
            --card-bg: #121212; 
            --text-color: #ffffff; 
        }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; padding: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        header { 
            padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.95); border-bottom: 1px solid #222;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; }

        .lang-switcher { display: flex; background: #222; padding: 3px; border-radius: 8px; }
        .lang-btn {
            background: transparent; color: #888; border: none; padding: 5px 12px;
            font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 6px;
        }
        .lang-btn.active { background: var(--primary-color); color: white; }

        .container { padding: 15px; max-width: 1200px; margin: 0 auto; }

        /* Player Sektion */
        #player-section { display: none; animation: fadeIn 0.3s ease; }
        
        .video-container { 
            position: relative; 
            width: 100%; 
            padding-bottom: 160%; /* Optimiert für Mobile Menüs */
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
        }

        @media (min-width: 768px) {
            .video-container { padding-bottom: 56.25%; }
        }

        .video-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .btn-back { 
            background: #222; color: white; border: 1px solid #444; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer; 
            margin-bottom: 15px; font-weight: bold; width: 100%;
        }

        /* Poster Grid */
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
        }

        .movie-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            cursor: pointer; 
            border: 1px solid #222; 
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .movie-card:hover { border-color: var(--primary-color); transform: translateY(-3px); }

        .card-img { 
            aspect-ratio: 2/3; 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--primary-color); 
            font-weight: bold; 
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
        }

        .card-title { padding: 10px; font-size: 0.85rem; text-align: center; margin: 0; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 600px) { .movie-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">DEXTER<span style="color:var(--primary-color)">HUB</span></div>
        <div class="lang-switcher">
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="btn-tr" onclick="setLanguage('tr')">TR</button>
        </div>
    </header>

    <div class="container">
        <section id="player-section">
            <button class="btn-back" id="text-back" onclick="closePlayer()">← Back</button>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <h2 id="text-heading" style="border-left: 3px solid var(--primary-color); padding-left: 10px; font-size: 1.1rem; margin-bottom: 20px;">Series Collection</h2>
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <script>
        const uiTranslations = {
            en: { heading: "Series Collection", back: "← Back to Overview" },
            tr: { heading: "Seri Koleksiyonu", back: "← Genel Bakışa Dön" }
        };

        const contentData = [
            { 
                id: "1405", 
                en: "Dexter", 
                tr: "Dexter", 
                img: "https://image.tmdb.org/t/p/w500/m99v79IpSjnf6Wv90T4YpS69m7f.jpg" 
            },
            { 
                id: "259909", 
                en: "Dexter: Resurrection", 
                tr: "Dexter: Resurrection", 
                img: "https://image.tmdb.org/t/p/w500/8Xp8T90W0lR0kZ3O7K7YVv8L6b.jpg" 
            },
            { 
                id: "131927", 
                en: "Dexter: New Blood", 
                tr: "Dexter: New Blood", 
                img: "https://image.tmdb.org/t/p/w500/7vX9z66vY9Z2eXvX9vVvVvVvVv.jpg" 
            },
            { 
                id: "219937", 
                en: "Dexter: Original Sin", 
                tr: "Dexter: Original Sin", 
                img: "https://image.tmdb.org/t/p/w500/pA2kSNoH8Z6YyOaY6M0XF1W2.jpg" 
            },
            { 
                id: "49530", 
                en: "Dexter: Early Cuts", 
                tr: "Dexter: Early Cuts", 
                img: "https://image.tmdb.org/t/p/w500/6y0W8Y6O7K7YVv8L6b8Xp8T90.jpg" 
            }
        ];

        let currentLang = localStorage.getItem('dex_lang') || 'en';
        let activeId = null;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('dex_lang', lang);
            document.getElementById('text-heading').innerText = uiTranslations[lang].heading;
            document.getElementById('text-back').innerText = uiTranslations[lang].back;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = contentData.map(item => {
                const title = item[currentLang];
                // Falls das Bild fehlt, wird der Titel angezeigt
                return `
                <div class="movie-card" onclick="playContent('${item.id}', '${title}')">
                    <div class="card-img" style="background-image: url('${item.img}')">
                        ${!item.img ? title : ''}
                    </div>
                    <p class="card-title">${title}</p>
                </div>
            `}).join('');
        }

        function playContent(id, title) {
            activeId = id;
            const url = `https://www.vidking.net/embed/tv/${id}/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
            document.getElementById('video-root').innerHTML = `<iframe src="${url}" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-popups-to-escape-sandbox" allow="autoplay; fullscreen"></iframe>`;
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('player-section').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closePlayer() {
            document.getElementById('video-root').innerHTML = '';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('home-section').style.display = 'block';
            activeId = null;
        }

        setLanguage(currentLang);
    </script>
</body>
</html>
