<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dexter Universe</title>
    <style>
        :root { --primary-color: #e50914; --bg-color: #050505; --card-bg: #121212; --text-color: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header { padding: 15px 20px; background: rgba(0,0,0,0.95); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        #player-section { display: none; margin-bottom: 30px; }
        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
        }
        .video-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .btn-back { background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; }
        
        h2 { font-size: 1.4rem; margin-bottom: 20px; border-left: 4px solid var(--primary-color); padding-left: 10px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .movie-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; text-align: center; padding-bottom: 10px; }
        .card-img { width: 100%; aspect-ratio: 2/3; background: #222; display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-weight: bold; }
        
        footer { text-align: center; padding: 30px; color: #666; font-size: 0.85rem; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">DEXTER<span style="color:var(--primary-color)">HUB</span></div>
    </header>

    <div class="container">
        <section id="player-section">
            <button class="btn-back" onclick="closePlayer()">← Back to Overview</button>
            <h3 id="display-title" style="margin-bottom: 15px;">Title</h3>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <h2 id="section-title">Chronological Order</h2>
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <footer>Made with ❤️ by <strong>Weird</strong></footer>

    <script>
        const contentData = [
            { id: 1, title: "Dexter", vidId: "1405" },
            { id: 2, title: "Dexter: Resurrection", vidId: "259909" },
            { id: 3, title: "Dexter: New Blood", vidId: "131927" },
            { id: 4, title: "Dexter: Original Sin", vidId: "219937" },
            { id: 5, title: "Dexter: Early Cuts", vidId: "49530" }
        ];

        const mainGrid = document.getElementById('main-grid');
        const playerSec = document.getElementById('player-section');
        const homeSec = document.getElementById('home-section');
        const videoRoot = document.getElementById('video-root');
        const displayTitle = document.getElementById('display-title');

        function renderGrid() {
            mainGrid.innerHTML = contentData.map(item => `
                <div class="movie-card" onclick="playContent('${item.vidId}', '${item.title}')">
                    <div class="card-img">${item.title}</div>
                    <p style="margin: 10px 0 0 0; font-size: 0.9rem;">${item.title}</p>
                </div>
            `).join('');
        }

        function playContent(vidId, title) {
            displayTitle.textContent = title;
            
            // WICHTIG: Sandbox wurde erweitert um Popups und Navigation
            // Ohne allow-top-navigation und allow-popups laden viele Player nicht korrekt.
            const embedUrl = `https://www.vidking.net/embed/tv/${vidId}/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
            
            videoRoot.innerHTML = `
                <iframe 
                    src="${embedUrl}" 
                    allowfullscreen 
                    sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-popups allow-popups-to-escape-sandbox"
                    allow="autoplay; fullscreen">
                </iframe>`;

            homeSec.style.display = 'none';
            playerSec.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closePlayer() {
            videoRoot.innerHTML = '';
            playerSec.style.display = 'none';
            homeSec.style.display = 'block';
        }

        renderGrid();
    </script>
</body>
</html>
