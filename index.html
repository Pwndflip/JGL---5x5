<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dexter Hub">
    <link rel="apple-touch-icon" href="IMG_2311.png">
    <title>Dexter Hub</title>
    <style>
        :root { 
            --primary-color: #e50914; 
            --bg-color: #050505; 
            --card-bg: #121212; 
            --text-color: #ffffff; 
        }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; padding: 0;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            touch-action: manipulation;
        }

        header { 
            padding: env(safe-area-inset-top) 20px 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.95); border-bottom: 1px solid #222;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; }

        .lang-switcher { display: flex; background: #222; padding: 3px; border-radius: 8px; }
        .lang-btn {
            background: transparent; color: #888; border: none; padding: 5px 12px;
            font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 6px;
        }
        .lang-btn.active { background: var(--primary-color); color: white; }

        .container { padding: 15px; max-width: 1200px; margin: 0 auto; min-height: 80vh; }

        #player-section { display: none; animation: fadeIn 0.3s ease; }
        
        .video-container { 
            position: relative; width: 100%; padding-bottom: 160%; 
            background: #000; border-radius: 12px; overflow: hidden; 
        }

        @media (min-width: 768px) { .video-container { padding-bottom: 56.25%; } }

        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .btn-back { 
            background: #222; color: white; border: 1px solid #444; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer; 
            margin-bottom: 15px; font-weight: bold; width: 100%;
        }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }

        .movie-card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            cursor: pointer; border: 1px solid #222; transition: transform 0.2s;
        }
        .movie-card:active { transform: scale(0.95); }

        .card-img { 
            aspect-ratio: 2/3; 
            background-size: cover; 
            background-position: center;
            background-color: #1a1a1a;
        }

        .card-title { padding: 10px; font-size: 0.85rem; text-align: center; margin: 0; font-weight: 500; }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 600px) { .movie-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">DEXTER<span style="color:var(--primary-color)">HUB</span></div>
        <div class="lang-switcher">
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="btn-tr" onclick="setLanguage('tr')">TR</button>
        </div>
    </header>

    <div class="container">
        <section id="player-section">
            <button class="btn-back" id="text-back" onclick="closePlayer()">← Back</button>
            <div class="video-container" id="video-root"></div>
        </section>

        <section id="home-section">
            <h2 id="text-heading" style="border-left: 3px solid var(--primary-color); padding-left: 10px; font-size: 1.1rem; margin-bottom: 20px;">Series Collection</h2>
            <div class="movie-grid" id="main-grid"></div>
        </section>
    </div>

    <footer>
        Made with ❤️ by Weird
    </footer>

    <script>
        const uiTranslations = {
            en: { heading: "Series Collection", back: "← Back to Overview" },
            tr: { heading: "Seri Koleksiyonu", back: "← Genel Bakışa Dön" }
        };

        const contentData = [
            { id: "1405", en: "Dexter", tr: "Dexter", img: "IMG_2311.png" },
            { id: "131927", en: "Dexter: New Blood", tr: "Dexter: New Blood", img: "IMG_2306.jpeg" },
            { id: "219937", en: "Dexter: Original Sin", tr: "Dexter: Original Sin", img: "IMG_2307.jpeg" },
            { id: "49530", en: "Dexter: Early Cuts", tr: "Dexter: Early Cuts", img: "IMG_2308.jpeg" }
        ];

        let currentLang = localStorage.getItem('dex_lang') || 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('dex_lang', lang);
            document.getElementById('text-heading').innerText = uiTranslations[lang].heading;
            document.getElementById('text-back').innerText = uiTranslations[lang].back;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = contentData.map(item => `
                <div class="movie-card" onclick="playContent('${item.id}', '${item[currentLang]}')">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <p class="card-title">${item[currentLang]}</p>
                </div>
            `).join('');
        }

        function playContent(id, title) {
            const url = `https://www.vidking.net/embed/tv/${id}/1/1?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
            document.getElementById('video-root').innerHTML = `<iframe src="${url}" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-popups-to-escape-sandbox" allow="autoplay; fullscreen"></iframe>`;
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('player-section').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closePlayer() {
            document.getElementById('video-root').innerHTML = '';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('home-section').style.display = 'block';
        }

        setLanguage(currentLang);
    </script>
</body>
</html>
